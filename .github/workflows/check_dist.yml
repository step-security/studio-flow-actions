name: Check Dist

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  check-dist:
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: 'package.json'
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Compare dist
        run: |
          if [ "$(git diff --ignore-space-at-eol --text check/dist deploy/dist sync/dist validate/dist | wc -l)" -gt "0" ]; then
            echo "::error::Detected uncommitted changes after build. Run 'npm run build' and commit the dist files."
            git diff --ignore-space-at-eol --text check/dist deploy/dist sync/dist validate/dist
            exit 1
          fi
