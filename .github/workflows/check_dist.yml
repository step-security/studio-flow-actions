name: Check Dist

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  check-dist:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: 'package.json'
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Compare dist
        run: |
          if [ "$(git diff --ignore-space-at-eol --text check/dist deploy/dist sync/dist validate/dist | wc -l)" -gt "0" ]; then
            echo "::error::Detected uncommitted changes after build. Run 'npm run build' and commit the dist files."
            git diff --ignore-space-at-eol --text check/dist deploy/dist sync/dist validate/dist
            exit 1
          fi
