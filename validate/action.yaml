name: Validate Studio Flow
description: Resolves Studio Flow definitions against a Twilio account and validates the result without publishing it
author: 'step-security'

inputs:
  # --- what to validate ---
  CONFIG_PATH:
    description: Location of the Studio configuration file, relative to the repository root
    required: true

  # --- behaviour ---
  VALIDATE_PREVIOUS_REVISION_USER:
    description: >-
      Set to `true` to fail when a target flow's live revision was published by
      something other than this pipeline, which indicates a manual edit that a
      deploy would overwrite
    required: false
    default: false

  # --- credentials ---
  TWILIO_API_KEY:
    description: SID of the Twilio API Key used for authentication
    required: true
  TWILIO_API_SECRET:
    description: Secret associated with the Twilio API Key
    required: true
  TOKEN:
    description: >-
      Token used to read configuration or flow files straight from the repository
      when they are not present on disk. Needs `contents: read`.
    required: false
    default: ${{ github.token }}

runs:
  using: node24
  main: dist/index.js
